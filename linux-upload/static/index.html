<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux Upload</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1117;
    color: #e1e4e8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .container { width: 100%; max-width: 680px; }

  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 4px; }
  .subtitle { color: #6e7681; font-size: 14px; margin-bottom: 8px; }

  /* ---- dir browser ---- */
  .dir-browser {
    background: #161b22; border: 1px solid #21262d; border-radius: 10px;
    margin-bottom: 24px; overflow: hidden;
  }
  .dir-browser .header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid #21262d;
  }
  .dir-browser .header .cur-path {
    flex: 1; font-size: 13px; font-family: ui-monospace, monospace;
    color: #58a6ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dir-browser .header button {
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
    padding: 4px 10px; border-radius: 5px; font-size: 12px; cursor: pointer;
    white-space: nowrap; transition: background .15s;
  }
  .dir-browser .header button:hover { background: #30363d; }
  .dir-browser .header button.back { font-size: 15px; padding: 4px 8px; line-height: 1; }
  .dir-browser .list {
    max-height: 420px; overflow-y: auto;
  }
  .dir-browser .list .entry {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; cursor: pointer; transition: background .1s;
    border-bottom: 1px solid #21262d11;
  }
  .dir-browser .list .entry:hover { background: #1c2128; }
  .dir-browser .list .entry .icon { color: #8b949e; flex-shrink: 0; }
  .dir-browser .list .entry .name {
    flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---- drop zone ---- */
  .drop-zone {
    border: 2px dashed #30363d;
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    margin-bottom: 24px;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: #58a6ff;
    background: rgba(88,166,255,.06);
  }
  .drop-zone svg { display: block; margin: 0 auto 12px; opacity: .5; }
  .drop-zone p { color: #8b949e; font-size: 15px; }
  .drop-zone span { color: #58a6ff; font-weight: 500; }
  .drop-zone small { display: block; margin-top: 6px; color: #484f58; font-size: 12px; }

  /* ---- file queue ---- */
  .queue { margin-bottom: 24px; }
  .queue-item {
    display: flex; align-items: center; gap: 12px;
    background: #161b22; border: 1px solid #21262d; border-radius: 8px;
    padding: 10px 14px; margin-bottom: 8px;
  }
  .queue-item .name { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-item .size { color: #8b949e; font-size: 12px; white-space: nowrap; }
  .queue-item .remove-btn {
    background: none; border: none; color: #6e7681; cursor: pointer;
    font-size: 16px; padding: 2px 6px; border-radius: 4px;
  }
  .queue-item .remove-btn:hover { color: #f85149; background: rgba(248,81,73,.1); }

  /* ---- progress bar ---- */
  .progress-wrap { margin-bottom: 24px; display: none; }
  .progress-wrap.active { display: block; }
  .progress-bar {
    width: 100%; height: 6px;
    background: #21262d; border-radius: 3px; overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; width: 0%;
    background: #238636; border-radius: 3px;
    transition: width .15s;
  }
  .progress-text {
    text-align: right; font-size: 12px; color: #8b949e; margin-top: 4px;
  }

  /* ---- upload btn ---- */
  .actions { display: flex; gap: 10px; margin-bottom: 32px; }
  .btn {
    padding: 10px 24px; border-radius: 8px; border: none; font-size: 14px;
    font-weight: 500; cursor: pointer; transition: background .15s;
  }
  .btn-primary { background: #238636; color: #fff; }
  .btn-primary:hover { background: #2ea043; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
  .btn-secondary:hover { background: #30363d; }

  /* ---- file list ---- */
  .section-title {
    font-size: 13px; font-weight: 600; color: #8b949e; text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 12px;
  }
  .file-list { list-style: none; }
  .file-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border: 1px solid #21262d; border-radius: 8px;
    margin-bottom: 6px; transition: background .15s;
  }
  .file-row:hover { background: #161b22; }
  .file-row .icon { color: #8b949e; flex-shrink: 0; }
  .file-row .info { flex: 1; min-width: 0; }
  .file-row .fname { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-row .fmeta { font-size: 12px; color: #6e7681; margin-top: 2px; }
  .file-row .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .row-actions a, .row-actions button {
    background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
    padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
    text-decoration: none; transition: background .15s;
  }
  .row-actions a:hover, .row-actions button:hover { background: #30363d; }
  .row-actions button.del:hover { background: rgba(248,81,73,.15); color: #f85149; border-color: rgba(248,81,73,.3); }

  .empty { text-align: center; color: #484f58; padding: 40px 0; font-size: 14px; }

  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #21262d; border: 1px solid #30363d; border-radius: 8px;
    padding: 10px 18px; font-size: 13px; color: #c9d1d9;
    opacity: 0; transform: translateY(10px); transition: all .25s;
    pointer-events: none; z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  .offscreen-file-input {
    position: absolute;
    left: -9999px;
    top: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Linux Upload</h1>
  <p class="subtitle">选择目标目录，拖放文件上传</p>

  <!-- dir browser -->
  <div class="dir-browser" id="dirBrowser">
    <div class="header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="cur-path" id="curPath">/</span>
      <button class="back" id="backBtn" title="返回上级">&larr;</button>
      <button id="selectBtn">选此目录</button>
    </div>
    <div class="list" id="dirList"></div>
  </div>

  <!-- drop zone -->
  <div class="drop-zone" id="dropZone">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p>拖放文件或文件夹到此处</p>
    <small>上传至: <span id="uploadPathLabel">/</span></small>
  </div>

  <div class="actions" style="margin-bottom:24px">
    <button class="btn btn-secondary" id="selectFilesBtn">选择文件</button>
    <button class="btn btn-secondary" id="selectFolderBtn">选择文件夹</button>
  </div>

  <!-- queue -->
  <div class="queue" id="queue"></div>

  <!-- progress -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <!-- actions -->
  <div class="actions">
    <button class="btn btn-primary" id="uploadBtn" disabled>上传</button>
    <button class="btn btn-secondary" id="clearBtn" disabled>清空队列</button>
  </div>

  <!-- uploaded files -->
  <div class="section-title">已上传文件</div>
  <ul class="file-list" id="fileList"><li class="empty">暂无文件</li></ul>
</div>

<div id="toast"></div>

<input type="file" id="fileInput" multiple class="offscreen-file-input">
<input type="file" id="folderInput" webkitdirectory class="offscreen-file-input">

<script>
const $ = (s) => document.querySelector(s);

const dropZone = $('#dropZone');
const fileInput = $('#fileInput');
const folderInput = $('#folderInput');
const queueEl = $('#queue');
const uploadBtn = $('#uploadBtn');
const clearBtn = $('#clearBtn');
const fileListEl = $('#fileList');
const toastEl = $('#toast');
const progressWrap = $('#progressWrap');
const progressFill = $('#progressFill');
const progressText = $('#progressText');
const curPathEl = $('#curPath');
const dirListEl = $('#dirList');
const backBtn = $('#backBtn');
const selectBtn = $('#selectBtn');
const uploadPathLabel = $('#uploadPathLabel');
const selectFilesBtn = $('#selectFilesBtn');
const selectFolderBtn = $('#selectFolderBtn');

let pendingFiles = [];
let currentPath = '/';
let uploadTarget = '';

const MAX_FILE_SIZE = 500 * 1024 * 1024;  // 500MB, 与服务端一致

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
}

function formatTime(ts) {
  return new Date(ts * 1000).toLocaleString('zh-CN');
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ---- dir browser ----
async function browseDir(path, autoSet = false) {
  try {
    const res = await fetch(`/api/browse?path=${encodeURIComponent(path)}`);
    if (!res.ok) { toast('无法访问此目录'); return; }
    const data = await res.json();
    currentPath = data.path;
    curPathEl.textContent = currentPath;
    backBtn.style.visibility = data.parent ? 'visible' : 'hidden';
    renderDirList(data.entries);
    if (autoSet) setUploadTarget(currentPath);
  } catch (e) {
    toast('浏览失败: ' + e.message);
  }
}

function renderDirList(entries) {
  const dirs = entries.filter(e => e.is_dir);
  if (dirs.length === 0) {
    dirListEl.innerHTML = '<div class="entry" style="color:#484f58;cursor:default">此目录下无子目录</div>';
    return;
  }
  dirListEl.innerHTML = dirs.map(e => `
    <div class="entry" data-path="${esc_attr(e.path)}">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="name">${esc(e.name)}</span>
    </div>
  `).join('');
}

function esc_attr(str) {
  return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

dirListEl.addEventListener('click', (e) => {
  const entry = e.target.closest('.entry');
  if (entry && entry.dataset.path) {
    browseDir(entry.dataset.path, true);
  }
});

backBtn.addEventListener('click', () => {
  const parent = currentPath.substring(0, currentPath.lastIndexOf('/')) || '/';
  browseDir(parent, true);
});

selectBtn.addEventListener('click', () => setUploadTarget(currentPath));

async function setUploadTarget(path) {
  try {
    const res = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ upload_dir: path }),
    });
    const data = await res.json();
    if (res.ok) {
      uploadTarget = path;
      uploadPathLabel.textContent = path;
      toast('上传目录: ' + path);
      loadFileList();
    } else {
      toast(data.error);
    }
  } catch (e) {
    toast('设置失败');
  }
}

async function loadConfig() {
  try {
    const res = await fetch('/api/config');
    const data = await res.json();
    uploadTarget = data.upload_dir || '/';
    uploadPathLabel.textContent = uploadTarget;
    browseDir(uploadTarget);
  } catch (e) { browseDir(''); }
}

// ---- queue ----
function addFiles(files) {
  let skipped = 0;
  for (const f of files) {
    if (f.size > MAX_FILE_SIZE) { skipped++; continue; }
    const fp = f._relativePath || f.webkitRelativePath || f.name;
    if (pendingFiles.find(x => (x._relativePath || x.name) === fp && x.size === f.size)) continue;
    if (!f._relativePath) f._relativePath = f.webkitRelativePath || f.name;
    pendingFiles.push(f);
  }
  if (skipped > 0) toast(`${skipped} 个文件超过大小限制 (${formatSize(MAX_FILE_SIZE)})，已跳过`);
  renderQueue();
}

async function addFilesFromEntry(entry, basePath) {
  if (entry.isFile) {
    return new Promise((resolve) => {
      entry.file((f) => {
        f._relativePath = basePath ? basePath + '/' + f.name : f.name;
        if (!pendingFiles.find(x => (x._relativePath || x.name) === f._relativePath && x.size === f.size)) {
          pendingFiles.push(f);
        }
        resolve();
      });
    });
  }
  if (entry.isDirectory) {
    const reader = entry.createReader();
    return new Promise((resolve) => {
      const readAll = () => {
        reader.readEntries(async (entries) => {
          if (entries.length === 0) { resolve(); return; }
          for (const e of entries) {
            await addFilesFromEntry(e, basePath ? basePath + '/' + entry.name : entry.name);
          }
          readAll();
        });
      };
      readAll();
    });
  }
}

async function handleDropItems(items) {
  const promises = [];
  for (const item of items) {
    if (item.kind !== 'file') continue;
    const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
    if (entry) {
      promises.push(addFilesFromEntry(entry, ''));
    } else {
      const f = item.getAsFile();
      if (f) pendingFiles.push(f);
    }
  }
  await Promise.all(promises);
  renderQueue();
}

function removeFile(idx) {
  pendingFiles.splice(idx, 1);
  renderQueue();
}

function clearQueue() {
  pendingFiles = [];
  renderQueue();
}

function renderQueue() {
  if (pendingFiles.length === 0) {
    queueEl.innerHTML = '';
    uploadBtn.disabled = true;
    clearBtn.disabled = true;
    return;
  }
  uploadBtn.disabled = false;
  clearBtn.disabled = false;
  queueEl.innerHTML = pendingFiles.map((f, i) => `
    <div class="queue-item">
      <span class="name">${esc(f._relativePath || f.name)}</span>
      <span class="size">${formatSize(f.size)}</span>
      <button class="remove-btn" data-idx="${i}">&times;</button>
    </div>
  `).join('');
}

// ---- events ----
selectFilesBtn.addEventListener('click', () => fileInput.click());
selectFolderBtn.addEventListener('click', () => folderInput.click());
dropZone.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  addFiles(fileInput.files);
  fileInput.value = '';
});

folderInput.addEventListener('change', () => {
  addFiles(folderInput.files);
  folderInput.value = '';
});

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', async (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  await handleDropItems(e.dataTransfer.items);
});

queueEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.remove-btn');
  if (btn && btn.dataset.idx !== undefined) {
    removeFile(parseInt(btn.dataset.idx, 10));
  }
});

clearBtn.addEventListener('click', clearQueue);

uploadBtn.addEventListener('click', async () => {
  if (pendingFiles.length === 0) return;
  if (!uploadTarget) return toast('请先选择目标目录');

  const form = new FormData();
  const paths = [];
  pendingFiles.forEach(f => {
    form.append('files', f);
    const rel = f._relativePath || f.name;
    paths.push(rel);
  });
  form.append('paths', JSON.stringify(paths));

  uploadBtn.disabled = true;
  uploadBtn.textContent = '上传中...';
  progressWrap.classList.add('active');
  progressFill.style.width = '0%';
  progressText.textContent = '0%';

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      progressFill.style.width = pct + '%';
      progressText.textContent = pct + '%';
      uploadBtn.textContent = `上传中... ${pct}%`;
    }
  };

  xhr.onload = () => {
    try {
      const data = JSON.parse(xhr.responseText);
      if (data.failed.length > 0) {
        toast(`上传完成：${data.uploaded.length} 成功，${data.failed.length} 失败`);
      } else {
        toast(`成功上传 ${data.uploaded.length} 个文件`);
      }
      clearQueue();
      loadFileList();
    } catch (err) {
      toast('解析响应失败');
    }
    uploadBtn.textContent = '上传';
    progressWrap.classList.remove('active');
  };

  xhr.onerror = () => {
    toast('上传失败: 网络错误');
    uploadBtn.textContent = '上传';
    progressWrap.classList.remove('active');
  };

  xhr.send(form);
});

// ---- file list ----
async function loadFileList() {
  try {
    const res = await fetch('/api/files');
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    if (data.files.length === 0) {
      fileListEl.innerHTML = '<li class="empty">暂无文件</li>';
      return;
    }
  fileListEl.innerHTML = data.files.map(f => `
    <li class="file-row">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
        <polyline points="13 2 13 9 20 9"/>
      </svg>
      <div class="info">
        <div class="fname">${esc(f.name)}</div>
        <div class="fmeta">${formatSize(f.size)} &middot; ${formatTime(f.modified)}</div>
      </div>
      <div class="row-actions">
        <a href="/api/download/${encodeURIComponent(f.name)}" download>下载</a>
      </div>
    </li>
  `).join('');
  } catch (e) {
    fileListEl.innerHTML = '<li class="empty">加载失败，请检查服务状态</li>';
  }
}

// ---- paste support ----
document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  const files = [];
  for (const item of items) {
    if (item.kind === 'file') files.push(item.getAsFile());
  }
  if (files.length > 0) addFiles(files);
});

// init
loadConfig();
loadFileList();
</script>
</body>
</html>
